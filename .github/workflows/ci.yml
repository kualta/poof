name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S warning skills/poof/scripts/poof.sh
      - name: Manifests are valid JSON
        run: jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json
